[project]
name = "kbl-predictor"
version = "0.1.0"
description = "KBL official-data collector and challenge recommendation system"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "beautifulsoup4>=4.12",
  "playwright>=1.50",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.7",
  "sqlalchemy>=2.0",
  "typer>=0.15",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[project.scripts]
kbl-predictor = "app.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
